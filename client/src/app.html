<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet" />
    <title>単語帳 - Tangocho</title>
    <script>
      // Apply theme before first paint to avoid flash: stored preference wins,
      // otherwise fall back to the OS color-scheme preference.
      try {
        var t = localStorage.getItem('tangocho-theme');
        if (t !== 'night' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'light';
        }
        document.documentElement.dataset.theme = t;
        // Match the document language to the stored UI locale before hydration
        var l = localStorage.getItem('tangocho-locale');
        if (l === 'ja' || l === 'en' || l === 'ru') {
          document.documentElement.lang = l;
        }
      } catch (_) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
